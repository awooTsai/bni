<!DOCTYPE html>
<html lang="zh-Hant"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>本週建議一對一｜BNI 富真白金分會</title>
<meta name="description" content="依每位會員當週 30 秒簡報的內容，整理出這週最值得約一對一的幾組夥伴，以及見面可以聊什麼。">
<meta property="og:title" content="本週建議一對一｜BNI 富真白金分會">
<meta property="og:description" content="這週最值得約一對一的幾組夥伴，以及見面可以聊什麼。">
<meta property="og:image" content="https://bni-fuzen.vercel.app/one-to-one/img/1002-1p.jpg">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#05090f;--bg2:#09101b;--panel:rgba(255,255,255,.045);--line:rgba(255,255,255,.14);--line2:rgba(255,255,255,.08);--text:#eef2f7;--mute:#9aa8ba;--amber:#ffa940;--amber2:#ff7a3d}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:17px;-webkit-font-smoothing:antialiased;scroll-behavior:smooth}
body{font-family:"Inter","Noto Sans TC",-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--text);line-height:1.75;overflow-x:hidden}
h1,h2,h3,h4{font-family:"Inter","Noto Sans TC",sans-serif;letter-spacing:.01em}
a{color:var(--amber)}

.topnav{position:sticky;top:0;z-index:80;background:rgba(5,9,15,.72);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border-bottom:1px solid var(--line2)}
.topnav-in{max-width:1180px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.topnav-brand{display:flex;align-items:center;gap:11px;font-weight:700;color:var(--text);font-size:17px;letter-spacing:.04em;text-decoration:none}
.topnav-brand::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--amber);box-shadow:0 0 0 4px rgba(255,169,64,.18),0 0 16px 2px rgba(255,169,64,.8)}
.topnav-links{display:flex;gap:10px;flex-wrap:wrap}
.topnav-links a{font-size:16px;font-weight:500;text-decoration:none;color:var(--text);border:1px solid var(--line);border-radius:3px;padding:7px 15px;transition:background .2s,color .2s}
.topnav-links a:hover{background:var(--text);color:var(--bg)}

.band{position:relative;min-height:calc(100svh - 62px);display:flex;align-items:center;background:var(--bg) url('img/o2o-hero.jpg') 90% center/cover no-repeat;overflow:hidden}
.band::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(5,9,15,.92) 0,rgba(5,9,15,.7) 30%,rgba(5,9,15,.12) 62%,rgba(5,9,15,.1) 100%),linear-gradient(180deg,rgba(5,9,15,.45) 0,rgba(5,9,15,0) 22%,rgba(5,9,15,0) 75%,var(--bg) 100%);pointer-events:none}
.intro{position:relative;z-index:2;max-width:1320px;width:100%;margin:0 auto;padding:64px 28px 96px}
.intro>*{max-width:min(30em,38vw)}
.intro .wk{display:flex;align-items:center;gap:14px;color:var(--amber);font-size:16px;font-weight:600;letter-spacing:.16em}
.intro .wk::before{content:"";width:44px;height:1px;background:var(--amber)}
.intro h1{font-size:clamp(34px,3.7vw,56px);max-width:min(9em,38vw);font-weight:300;line-height:1.22;margin-top:18px;text-wrap:balance;color:#fff;text-shadow:0 2px 30px rgba(0,0,0,.5)}
.intro p{margin-top:18px;font-size:18px;color:rgba(238,242,247,.88)}
.intro .how{margin-top:20px;padding:2px 0 2px 16px;border-left:2px solid var(--amber);font-size:17px;color:var(--text)}
.weeks{margin-top:24px;display:flex;gap:10px;flex-wrap:wrap;font-size:16px}
.weeks a{text-decoration:none;cursor:pointer;color:var(--text);border:1px solid var(--line);border-radius:3px;padding:3px 14px;font-weight:500;background:rgba(5,9,15,.5)}
.weeks a.on{background:var(--amber);border-color:var(--amber);color:#1a0d00;font-weight:700}

.pairs{max-width:1180px;margin:0 auto;padding:30px 24px 50px}
.pair{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,1fr);gap:48px;align-items:center;padding:52px 0;border-top:1px solid var(--line)}
.pair:first-child{border-top:0}
.pair:nth-child(even) .pic{order:2}
.pic{position:relative}
.pic::after{content:"";position:absolute;left:24px;right:24px;top:-1px;height:2px;background:linear-gradient(90deg,transparent,var(--amber),transparent)}
.pic img{display:block;width:100%;height:auto;aspect-ratio:3/2;object-fit:cover;border:1px solid var(--line);border-radius:4px;box-shadow:0 30px 70px rgba(0,0,0,.55),0 0 60px rgba(255,169,64,.08);background:var(--bg2)}
.names{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap}
.who h2{font-size:clamp(28px,3.6vw,40px);font-weight:600;line-height:1.2;color:#fff}
.who span{display:block;margin-top:4px;font-size:16px;color:var(--mute);font-weight:500}
.x{font-weight:200;font-size:32px;color:var(--amber);line-height:1.3}
.hook{margin-top:18px;font-weight:600;font-size:21px;line-height:1.55;color:var(--amber)}
.why{margin-top:12px;font-size:17px;color:rgba(238,242,247,.88)}
.talk{margin-top:22px;background:var(--panel);border:1px solid var(--line2);border-radius:4px;padding:16px 22px 8px}
.talk h3{font-weight:600;font-size:16px;letter-spacing:.08em;color:var(--mute)}
.talk ul{list-style:none;margin-top:6px}
.talk li{position:relative;padding:10px 0 10px 24px;font-size:17px;border-bottom:1px solid var(--line2)}
.talk li:last-child{border-bottom:0}
.talk li::before{content:"";position:absolute;left:3px;top:20px;width:8px;height:8px;border-radius:50%;background:var(--amber);box-shadow:0 0 10px rgba(255,169,64,.7)}

.foot{background:var(--bg);border-top:1px solid var(--line2)}
.foot-in{max-width:1180px;margin:0 auto;padding:34px 24px 56px;font-size:16px;color:rgba(238,242,247,.78)}
.foot-in p+p{margin-top:8px}

@media(max-width:820px){
  .intro{padding:40px 18px 0}
  .pairs{padding:10px 18px 30px}
  .pair{grid-template-columns:1fr;gap:24px;padding:36px 0}
  .pair:nth-child(even) .pic{order:0}
  .topnav-in{padding:12px 18px}
  .band{min-height:calc(100svh - 56px);align-items:flex-end;background:var(--bg) url('img/o2o-hero-m.jpg') center top/cover no-repeat}
  .band::before{background:linear-gradient(180deg,rgba(5,9,15,.2) 0,rgba(5,9,15,0) 22%,rgba(5,9,15,0) 40%,rgba(5,9,15,.82) 66%,var(--bg) 100%)}
  .intro{padding:40px 18px 40px}
  .intro>*{max-width:none}
}
@media(max-aspect-ratio:6/5){
  .band{min-height:calc(100svh - 56px);align-items:flex-end;background:var(--bg) url('img/o2o-hero-m.jpg') center top/cover no-repeat}
  .band::before{background:linear-gradient(180deg,rgba(5,9,15,.2) 0,rgba(5,9,15,0) 22%,rgba(5,9,15,0) 40%,rgba(5,9,15,.82) 66%,var(--bg) 100%)}
  .intro{padding:40px 18px 40px}
  .intro>*,.intro h1{max-width:none}
}
</style>
</head><body>

<nav class="topnav"><div class="topnav-in">
<a class="topnav-brand" href="/">BNI 富真白金分會</a>
<div class="topnav-links">
<a href="/">回分會首頁</a>
<a href="https://docs.google.com/spreadsheets/d/1HjaORwPAahieiA2uMeoxMzmcAY7VrIRfA_pdf3boTiQ/edit?usp=sharing" target="_blank" rel="noopener">每人 30 秒完整紀錄</a>
</div>
</div></nav>

<header class="band"><div class="intro">
<div class="wk" id="wk"></div>
<h1>這週，建議先約這幾位一對一</h1>
<p>每週例會結束後，我們會把每位夥伴 30 秒講的內容對過一輪，找出這週最容易談出合作的組合。</p>
<p class="how">看到自己的名字，就直接約對方。下面寫了為什麼是你們兩位，以及見面可以先聊哪幾件事。</p>
<div class="weeks" id="weeks"></div>
</div></header>

<main class="pairs" id="pairs"></main>

<footer class="foot"><div class="foot-in">
<p>配對依當週「每人 30 秒」的內容整理，只是建議；沒有出現在這裡的組合，一樣歡迎自己約。</p>
<p>每組的照片是 AI 以兩位會員的簡報形象照合成的日常情境，依當週媒合內容想像，不是實際拍攝的畫面；已取得會員同意。</p>
</div></footer>

<script src="/one-to-one/pairs.js?v=20261015"></script>
<script>
(function(){
  var W=(window.ONE2ONE&&ONE2ONE.weeks)||[];
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function pick(){var d=new URLSearchParams(location.search).get('w');for(var i=0;i<W.length;i++)if(W[i].date===d)return i;return 0}
  function render(i){
    var w=W[i];if(!w)return;
    document.getElementById('wk').textContent=w.label+'｜共 '+w.pairs.length+' 組';
    document.getElementById('pairs').innerHTML=w.pairs.map(function(p){
      return '<section class="pair"><div class="pic"><img loading="lazy" width="1280" height="853" src="/one-to-one/'+esc(p.img)+'" alt="'+esc(p.a.name+'（'+p.a.pro+'）與'+p.b.name+'（'+p.b.pro+'）一對一的情境示意照')+'"></div>'
        +'<div class="txt"><div class="names"><div class="who"><h2>'+esc(p.a.name)+'</h2><span>'+esc(p.a.pro)+'</span></div><div class="x" aria-hidden="true">×</div><div class="who"><h2>'+esc(p.b.name)+'</h2><span>'+esc(p.b.pro)+'</span></div></div>'
        +'<p class="hook">'+esc(p.hook)+'</p><p class="why">'+esc(p.why)+'</p>'
        +'<div class="talk"><h3>見面可以先聊</h3><ul>'+p.talk.map(function(t){return '<li>'+esc(t)+'</li>'}).join('')+'</ul></div></div></section>';
    }).join('');
    var ws=document.getElementById('weeks');
    ws.innerHTML=W.length>1?W.map(function(x,k){return '<a href="?w='+x.date+'" class="'+(k===i?'on':'')+'">'+esc(x.label)+'</a>'}).join(''):'';
  }
  render(pick());
})();
</script>
</body></html>
