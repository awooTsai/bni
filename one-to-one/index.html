<!DOCTYPE html>
<html lang="zh-Hant"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>本週建議一對一｜BNI 富真白金分會</title>
<meta name="description" content="依每位會員當週 30 秒簡報的內容，整理出這週最值得約一對一的幾組夥伴，以及見面可以聊什麼。">
<meta property="og:title" content="本週建議一對一｜BNI 富真白金分會">
<meta property="og:description" content="這週最值得約一對一的幾組夥伴，以及見面可以聊什麼。">
<meta property="og:image" content="https://bni-fuzen.vercel.app/one-to-one/img/1002-1p.jpg">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#0b1f3a;--ink2:#16355f;--red:#e8452c;--sun:#ffb81c;--teal:#0fa3a3;--sky:#d9e8f5;--bg:#f3f6f9;--line:#d5dee8;--mute:#51647c}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:17px;-webkit-font-smoothing:antialiased;scroll-behavior:smooth}
body{font-family:"Noto Sans TC","Inter",-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--ink);line-height:1.8;overflow-x:hidden}
h1,h2,h3{font-family:"Noto Sans TC",sans-serif;font-weight:900;letter-spacing:.01em}
a{color:var(--red)}

.topnav{position:sticky;top:0;z-index:80;background:#fff;border-bottom:3px solid var(--ink)}
.topnav-in{max-width:1180px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.topnav-brand{display:flex;align-items:center;gap:10px;font-weight:900;color:var(--ink);font-size:18px;letter-spacing:.03em;text-decoration:none}
.topnav-brand::before{content:"";width:14px;height:14px;background:var(--red);display:block}
.topnav-links{display:flex;gap:12px;flex-wrap:wrap}
.topnav-links a{font-size:16px;font-weight:700;text-decoration:none;color:var(--ink);border:2px solid var(--ink);border-radius:6px;padding:6px 14px;transition:background .15s,color .15s}
.topnav-links a:hover{background:var(--ink);color:#fff}

.band{position:relative;background:var(--sky) url('img/band-bridge-v3.jpg') center bottom/max(100%,900px) auto no-repeat;padding-bottom:clamp(170px,19vw,270px)}
.intro{max-width:1180px;margin:0 auto;padding:56px 24px 0}
.intro .wk{display:inline-block;background:var(--red);color:#fff;font-size:16px;font-weight:700;letter-spacing:.1em;padding:3px 14px}
.intro h1{font-size:clamp(32px,4.6vw,54px);line-height:1.25;margin-top:16px;text-wrap:balance;color:var(--ink)}
.intro p{max-width:34em;margin-top:16px;font-size:18px;color:var(--ink)}
.intro .how{margin-top:18px;padding:2px 0 2px 16px;border-left:5px solid var(--red);font-size:17px;font-weight:500;max-width:36em}
.weeks{margin-top:20px;display:flex;gap:10px;flex-wrap:wrap;font-size:16px}
.weeks a{text-decoration:none;cursor:pointer;color:var(--ink);border:2px solid var(--ink);border-radius:6px;padding:3px 14px;font-weight:700;background:#fff}
.weeks a.on{background:var(--ink);color:#fff}

.pairs{max-width:1180px;margin:0 auto;padding:30px 24px 40px}
.pair{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,1fr);gap:44px;align-items:center;padding:44px 0;border-top:3px solid var(--ink)}
.pair:first-child{border-top:0}
.pair:nth-child(even) .pic{order:2}
.pic img{display:block;width:100%;height:auto;aspect-ratio:3/2;object-fit:cover;border-bottom:6px solid var(--red);box-shadow:0 18px 40px rgba(11,31,58,.2);background:var(--ink)}
.names{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap}
.who h2{font-size:clamp(28px,3.6vw,40px);line-height:1.2;color:var(--ink)}
.who span{display:block;margin-top:4px;font-size:16px;color:var(--mute);font-weight:700}
.x{font-weight:900;font-size:30px;color:var(--red);line-height:1.3}
.hook{margin-top:18px;font-weight:900;font-size:21px;line-height:1.55;color:var(--red)}
.why{margin-top:12px;font-size:17px;color:var(--ink)}
.talk{margin-top:22px;background:#fff;border-top:4px solid var(--ink);padding:14px 20px 8px}
.talk h3{font-weight:900;font-size:16px;letter-spacing:.06em;color:var(--ink)}
.talk ul{list-style:none;margin-top:6px}
.talk li{position:relative;padding:9px 0 9px 22px;font-size:17px;border-bottom:1px solid var(--line)}
.talk li:last-child{border-bottom:0}
.talk li::before{content:"";position:absolute;left:2px;top:20px;width:10px;height:10px;background:var(--red)}

.foot{background:var(--ink);position:relative}
.foot::before{content:"";display:block;height:18px;background:repeating-linear-gradient(90deg,var(--red) 0 64px,var(--sun) 64px 128px,var(--teal) 128px 192px,#fff 192px 256px,var(--ink2) 256px 320px)}
.foot-in{max-width:1180px;margin:0 auto;padding:30px 24px 52px;font-size:16px;color:rgba(255,255,255,.88)}
.foot-in p+p{margin-top:8px}

@media(max-width:820px){
  .intro{padding:36px 18px 0}
  .pairs{padding:10px 18px 30px}
  .pair{grid-template-columns:1fr;gap:22px;padding:34px 0}
  .pair:nth-child(even) .pic{order:0}
  .topnav-in{padding:12px 18px}
  .band{padding-bottom:150px;background-position:62% bottom}
}
</style>
</head><body>

<nav class="topnav"><div class="topnav-in">
<a class="topnav-brand" href="/">BNI 富真白金分會</a>
<div class="topnav-links">
<a href="/">回分會首頁</a>
<a href="https://docs.google.com/spreadsheets/d/1HjaORwPAahieiA2uMeoxMzmcAY7VrIRfA_pdf3boTiQ/edit?usp=sharing" target="_blank" rel="noopener">每人 30 秒完整紀錄</a>
</div>
</div></nav>

<header class="band"><div class="intro">
<div class="wk" id="wk"></div>
<h1>這週，建議先約這幾位一對一</h1>
<p>每週例會結束後，我們會把每位夥伴 30 秒講的內容對過一輪，找出這週最容易談出合作的組合。</p>
<p class="how">看到自己的名字，就直接約對方。下面寫了為什麼是你們兩位，以及見面可以先聊哪幾件事。</p>
<div class="weeks" id="weeks"></div>
</div></header>

<main class="pairs" id="pairs"></main>

<footer class="foot"><div class="foot-in">
<p>配對依當週「每人 30 秒」的內容整理，只是建議；沒有出現在這裡的組合，一樣歡迎自己約。</p>
<p>每組的照片是 AI 以兩位會員的簡報形象照合成的日常情境，依當週媒合內容想像，不是實際拍攝的畫面；已取得會員同意。</p>
</div></footer>

<script src="/one-to-one/pairs.js?v=20261011"></script>
<script>
(function(){
  var W=(window.ONE2ONE&&ONE2ONE.weeks)||[];
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function pick(){var d=new URLSearchParams(location.search).get('w');for(var i=0;i<W.length;i++)if(W[i].date===d)return i;return 0}
  function render(i){
    var w=W[i];if(!w)return;
    document.getElementById('wk').textContent=w.label+'｜共 '+w.pairs.length+' 組';
    document.getElementById('pairs').innerHTML=w.pairs.map(function(p){
      return '<section class="pair"><div class="pic"><img loading="lazy" width="1280" height="853" src="/one-to-one/'+esc(p.img)+'" alt="'+esc(p.a.name+'（'+p.a.pro+'）與'+p.b.name+'（'+p.b.pro+'）一對一的情境示意照')+'"></div>'
        +'<div class="txt"><div class="names"><div class="who"><h2>'+esc(p.a.name)+'</h2><span>'+esc(p.a.pro)+'</span></div><div class="x" aria-hidden="true">×</div><div class="who"><h2>'+esc(p.b.name)+'</h2><span>'+esc(p.b.pro)+'</span></div></div>'
        +'<p class="hook">'+esc(p.hook)+'</p><p class="why">'+esc(p.why)+'</p>'
        +'<div class="talk"><h3>見面可以先聊</h3><ul>'+p.talk.map(function(t){return '<li>'+esc(t)+'</li>'}).join('')+'</ul></div></div></section>';
    }).join('');
    var ws=document.getElementById('weeks');
    ws.innerHTML=W.length>1?W.map(function(x,k){return '<a href="?w='+x.date+'" class="'+(k===i?'on':'')+'">'+esc(x.label)+'</a>'}).join(''):'';
  }
  render(pick());
})();
</script>
</body></html>
