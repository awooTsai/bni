<!DOCTYPE html>
<html lang="zh-Hant"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>本週建議一對一｜BNI 富真白金分會</title>
<meta name="description" content="依每位會員當週 30 秒簡報的內容，整理出這週最值得約一對一的幾組夥伴，以及見面可以聊什麼。">
<meta property="og:title" content="本週建議一對一｜BNI 富真白金分會">
<meta property="og:description" content="這週最值得約一對一的幾組夥伴，以及見面可以聊什麼。">
<meta property="og:image" content="https://bni-fuzen.vercel.app/one-to-one/img/1002-1.jpg">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--deep:#06152b;--ink:#0a1f3d;--gold:#d4ab5d;--paper:#f6efe1;--line:#1a3458;--soft:rgba(246,239,225,.8)}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:17px;-webkit-font-smoothing:antialiased;scroll-behavior:smooth}
body{font-family:"Inter","Noto Sans TC",-apple-system,BlinkMacSystemFont,sans-serif;background:var(--deep);color:var(--paper);line-height:1.8;overflow-x:hidden}
h1,h2,h3{font-family:"Noto Serif TC",serif;font-weight:900;letter-spacing:.02em}
a{color:var(--gold)}

.topnav{position:sticky;top:0;z-index:80;background:rgba(6,21,43,.92);backdrop-filter:blur(12px);border-bottom:1px solid rgba(212,171,93,.2)}
.topnav-in{max-width:1180px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.topnav-brand{font-family:"Noto Serif TC",serif;font-weight:900;color:var(--gold);font-size:18px;letter-spacing:.05em;text-decoration:none}
.topnav-links{display:flex;gap:22px;flex-wrap:wrap}
.topnav-links a{font-size:16px;font-weight:600;text-decoration:none;border-bottom:1px solid rgba(212,171,93,.45);padding-bottom:2px}
.topnav-links a:hover{color:var(--paper);border-color:var(--paper)}

.intro{max-width:1180px;margin:0 auto;padding:64px 24px 28px}
.intro .wk{color:var(--gold);font-size:16px;font-weight:700;letter-spacing:.12em}
.intro h1{font-size:clamp(34px,5.4vw,58px);line-height:1.25;margin-top:10px;text-wrap:balance}
.intro p{max-width:34em;margin-top:18px;font-size:18px;color:var(--soft)}
.intro .how{margin-top:22px;padding-left:16px;border-left:3px solid var(--gold);font-size:17px;color:var(--paper);max-width:36em}
.weeks{margin-top:26px;display:flex;gap:18px;flex-wrap:wrap;font-size:16px}
.weeks a{text-decoration:none;border-bottom:1px solid rgba(212,171,93,.45);cursor:pointer}
.weeks a.on{color:var(--paper);border-color:var(--paper);font-weight:700}

.pairs{max-width:1180px;margin:0 auto;padding:20px 24px 40px}
.pair{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,1fr);gap:44px;align-items:center;padding:52px 0;border-top:1px solid var(--line)}
.pair:nth-child(even) .pic{order:2}
.pic img{display:block;width:100%;height:auto;aspect-ratio:3/2;object-fit:cover;border-radius:6px;border:1px solid rgba(212,171,93,.28);background:var(--ink)}
.names{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap}
.who h2{font-size:clamp(28px,3.6vw,38px);line-height:1.2;color:var(--paper)}
.who span{display:block;margin-top:4px;font-size:16px;color:var(--gold);font-weight:600}
.x{font-family:"Noto Serif TC",serif;font-size:28px;color:var(--gold);line-height:1.5}
.hook{margin-top:20px;font-family:"Noto Serif TC",serif;font-weight:700;font-size:21px;line-height:1.55;color:var(--gold)}
.why{margin-top:12px;font-size:17px;color:var(--soft)}
.talk{margin-top:22px}
.talk h3{font-family:"Noto Sans TC",sans-serif;font-weight:700;font-size:16px;letter-spacing:.08em;color:var(--paper)}
.talk ul{list-style:none;margin-top:8px}
.talk li{position:relative;padding:9px 0 9px 22px;font-size:17px;border-bottom:1px dashed rgba(246,239,225,.16)}
.talk li:last-child{border-bottom:0}
.talk li::before{content:"";position:absolute;left:2px;top:21px;width:9px;height:2px;background:var(--gold)}

.foot{border-top:1px solid var(--line);background:var(--ink)}
.foot-in{max-width:1180px;margin:0 auto;padding:36px 24px 56px;font-size:16px;color:var(--soft)}
.foot-in p+p{margin-top:8px}

@media(max-width:820px){
  .intro{padding:44px 18px 18px}
  .pairs{padding:10px 18px 30px}
  .pair{grid-template-columns:1fr;gap:22px;padding:36px 0}
  .pair:nth-child(even) .pic{order:0}
  .topnav-in{padding:12px 18px}
  .topnav-links{gap:16px}
}
</style>
</head><body>

<nav class="topnav"><div class="topnav-in">
<a class="topnav-brand" href="/">BNI 富真白金分會</a>
<div class="topnav-links">
<a href="/">回分會首頁</a>
<a href="https://docs.google.com/spreadsheets/d/1HjaORwPAahieiA2uMeoxMzmcAY7VrIRfA_pdf3boTiQ/edit?usp=sharing" target="_blank" rel="noopener">每人 30 秒完整紀錄</a>
</div>
</div></nav>

<header class="intro">
<div class="wk" id="wk"></div>
<h1>這週，建議先約這幾位一對一</h1>
<p>每週例會結束後，我們會把每位夥伴 30 秒講的內容對過一輪，找出這週最容易談出合作的組合。</p>
<p class="how">看到自己的名字，就直接約對方。下面寫了為什麼是你們兩位，以及見面可以先聊哪幾件事。</p>
<div class="weeks" id="weeks"></div>
</header>

<main class="pairs" id="pairs"></main>

<footer class="foot"><div class="foot-in">
<p>配對依當週「每人 30 秒」的內容整理，只是建議；沒有出現在這裡的組合，一樣歡迎自己約。</p>
<p>每組的圖片是 AI 繪製的示意圖，不是會員本人。</p>
</div></footer>

<script src="/one-to-one/pairs.js?v=20261009a"></script>
<script>
(function(){
  var W=(window.ONE2ONE&&ONE2ONE.weeks)||[];
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function pick(){var d=new URLSearchParams(location.search).get('w');for(var i=0;i<W.length;i++)if(W[i].date===d)return i;return 0}
  function render(i){
    var w=W[i];if(!w)return;
    document.getElementById('wk').textContent=w.label+'｜共 '+w.pairs.length+' 組';
    document.getElementById('pairs').innerHTML=w.pairs.map(function(p){
      return '<section class="pair"><div class="pic"><img loading="lazy" width="1280" height="853" src="/one-to-one/'+esc(p.img)+'" alt="'+esc(p.a.name+'（'+p.a.pro+'）與'+p.b.name+'（'+p.b.pro+'）一對一的示意圖')+'"></div>'
        +'<div class="txt"><div class="names"><div class="who"><h2>'+esc(p.a.name)+'</h2><span>'+esc(p.a.pro)+'</span></div><div class="x" aria-hidden="true">×</div><div class="who"><h2>'+esc(p.b.name)+'</h2><span>'+esc(p.b.pro)+'</span></div></div>'
        +'<p class="hook">'+esc(p.hook)+'</p><p class="why">'+esc(p.why)+'</p>'
        +'<div class="talk"><h3>見面可以先聊</h3><ul>'+p.talk.map(function(t){return '<li>'+esc(t)+'</li>'}).join('')+'</ul></div></div></section>';
    }).join('');
    var ws=document.getElementById('weeks');
    ws.innerHTML=W.length>1?W.map(function(x,k){return '<a href="?w='+x.date+'" class="'+(k===i?'on':'')+'">'+esc(x.label)+'</a>'}).join(''):'';
  }
  render(pick());
})();
</script>
</body></html>
